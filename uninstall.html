<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LB TAB Layers — アンインストールのアンケート</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --ink:#212529; --sub:#6c757d; --line:#e5e1dd; --bg:#fbf8f6; --accent:#E30163; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Sans","Meiryo",system-ui,sans-serif; line-height:1.7; }
  .wrap { max-width:560px; margin:0 auto; padding:40px 16px 64px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; color:var(--ink); text-decoration:none; }
  .brand img { width:32px; height:32px; }
  h1 { font-size:22px; margin:28px 0 6px; }
  .lead { color:var(--sub); margin:0 0 24px; font-size:15px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; }
  .q { font-weight:700; margin:0 0 12px; }
  label.opt { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  label.opt:hover { border-color:#c9c3be; }
  label.opt input { accent-color:var(--accent); width:18px; height:18px; }
  textarea { width:100%; min-height:96px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; resize:vertical; margin-top:4px; }
  .q2 { margin:20px 0 4px; font-weight:700; }
  .q2 small { font-weight:400; color:var(--sub); }
  button { margin-top:18px; width:100%; padding:13px; border:0; border-radius:999px; background:var(--ink); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .note { color:var(--sub); font-size:13px; margin-top:14px; }
  .thanks { display:none; text-align:center; padding:12px 0; }
  .thanks p { margin:6px 0; }
  .done .form { display:none; } .done .thanks { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="./"><img src="lb-logo.svg" alt="">LB TAB Layers</a>
  <h1 data-t="title">使ってくださって、ありがとうございました</h1>
  <p class="lead" data-t="lead">よろしければ、消した理由を1つだけ教えてください。次の改善に使わせていただきます。</p>

  <div class="card" id="card">
    <form class="form" id="f">
      <p class="q" data-t="q1">どうしてアンインストールしましたか？</p>
      <div id="opts"></div>
      <p class="q2"><span data-t="q2">よければ理由を教えてください</span> <small data-t="opt">（任意）</small></p>
      <textarea id="comment" maxlength="1000"></textarea>
      <button type="submit" id="send" disabled data-t="send">送信する</button>
      <p class="note" data-t="note">お名前やメールアドレスは聞きません。送られるのは、選んだ答えと書いた文、拡張の版と使った日数だけです。</p>
    </form>
    <div class="thanks">
      <p><strong data-t="thanks1">ありがとうございました。</strong></p>
      <p data-t="thanks2">いただいた声は、すべて読んでいます。</p>
    </div>
  </div>
</div>

<script>
(function () {
  // ===== Google フォームの送り先（フォームを作ったら入れる） =====
  // 事前入力した URL の「entry.数字」をそれぞれに入れる。空のままだと送信はせず、お礼だけ出す。
  var FORM_ACTION = ''; // 例: https://docs.google.com/forms/d/e/XXXX/formResponse
  var ENTRY = { reason: '', comment: '', version: '' };

  // 選択肢の値は、Google フォームの選択肢と一字一句同じにする（表示の言語に関係なく日本語で送る）
  var REASONS = [
    { v: '何のツールか分からなかった', en: "I didn't understand what it does" },
    { v: '重い・邪魔だった', en: 'It was slow or got in the way' },
    { v: '欲しい機能がなかった', en: "It didn't have a feature I needed" },
    { v: '他のツールで足りた', en: 'Another tool was enough' },
    { v: 'その他', en: 'Other' }
  ];
  var EN = {
    title: 'Thank you for trying LB TAB Layers',
    lead: 'If you have a moment, tell us the one main reason you removed it. It helps us improve.',
    q1: 'Why did you uninstall it?', q2: 'Anything you would like to add?', opt: '(optional)',
    send: 'Send', note: "We don't ask for your name or email. We only receive your answer, your comment, the extension version and how many days you used it.",
    thanks1: 'Thank you.', thanks2: 'We read every response.'
  };

  var p = new URLSearchParams(location.search);
  var lang = (p.get('lang') || navigator.language || 'ja').toLowerCase();
  var isJa = lang.indexOf('ja') === 0;
  if (!isJa) {
    document.documentElement.lang = 'en';
    document.title = 'LB TAB Layers — Uninstall survey';
    [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { var k = el.getAttribute('data-t'); if (EN[k]) el.textContent = EN[k]; });
  }

  var box = document.getElementById('opts');
  REASONS.forEach(function (r) {
    var l = document.createElement('label'); l.className = 'opt';
    var i = document.createElement('input'); i.type = 'radio'; i.name = 'reason'; i.value = r.v;
    i.addEventListener('change', function () { document.getElementById('send').disabled = false; });
    l.appendChild(i); l.appendChild(document.createTextNode(isJa ? r.v : r.en));
    box.appendChild(l);
  });

  // 版・使った日数・言語を1つの欄にまとめる（例：2.13.2 / 3日 / ja）
  function clean(s, max) { return String(s || '').replace(/[^\w.\-]/g, '').slice(0, max); }
  var meta = [clean(p.get('v'), 20) || '?', (clean(p.get('d'), 5) || '?') + '日', clean(p.get('lang'), 10) || '?'].join(' / ');

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var picked = document.querySelector('input[name=reason]:checked');
    if (!picked) return;
    document.getElementById('send').disabled = true;
    var done = function () { document.getElementById('card').className = 'card done'; };
    if (!FORM_ACTION || !ENTRY.reason) { done(); return; }
    var body = new URLSearchParams();
    body.append(ENTRY.reason, picked.value);
    if (ENTRY.comment) body.append(ENTRY.comment, document.getElementById('comment').value.slice(0, 1000));
    if (ENTRY.version) body.append(ENTRY.version, meta);
    // Google フォームは別のサイトなので、答えは読めない（no-cors）。送ったらお礼を出す。
    fetch(FORM_ACTION, { method: 'POST', mode: 'no-cors', body: body }).then(done, done);
  });
})();
</script>
</body>
</html>
